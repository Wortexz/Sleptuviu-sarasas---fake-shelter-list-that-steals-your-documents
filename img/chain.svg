<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1600" height="940" fill="#0d1117"/>

  <!-- header -->
  <text x="60" y="86" fill="#e6edf3" font-size="34" font-weight="700">Sleptuviu sarasas.xlsm</text>
  <text x="60" y="120" fill="#8b949e" font-size="19">Fake shelter list → VBA → PowerShell → WebDAV</text>

  <text x="60" y="186" fill="#58a6ff" font-size="18" font-weight="700">Execution chain</text>

  <g font-size="15" fill="#c9d1d9">
    <!-- 1 -->
    <rect x="60" y="206" width="264" height="196" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="242" fill="#e6edf3" font-size="18" font-weight="700">Lure</text>
    <text x="80" y="272">Empty shelter table (LT)</text>
    <rect x="80" y="294" width="224" height="50" rx="5" fill="#3d2e00" stroke="#d29922"/>
    <text x="92" y="315" fill="#e3b341" font-size="13">! Norėdami parodyti duomenis…</text>
    <text x="92" y="334" fill="#e3b341" font-size="13" font-weight="700">„Įgalinti turinį“</text>

    <!-- 2 -->
    <rect x="364" y="206" width="264" height="196" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="384" y="242" fill="#e6edf3" font-size="18" font-weight="700">Workbook_Open()</text>
    <text x="384" y="272">Reads hidden sheet</text>
    <text x="384" y="304" fill="#79c0ff" font-size="14" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">Лист1!A350</text>
    <text x="384" y="326" fill="#79c0ff" font-size="14" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">Лист1!B350</text>

    <!-- 3 -->
    <rect x="668" y="206" width="264" height="196" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="688" y="242" fill="#e6edf3" font-size="18" font-weight="700">powershell.exe</text>
    <text x="688" y="272">WScript.Shell, hidden</text>
    <text x="688" y="304" fill="#79c0ff" font-size="14" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">-EncodedCommand</text>

    <!-- 4 -->
    <rect x="972" y="206" width="264" height="196" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="992" y="242" fill="#e6edf3" font-size="18" font-weight="700">Collection</text>
    <text x="992" y="272">Fixed, USB, network drives</text>
    <text x="992" y="304" fill="#79c0ff" font-size="14" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">doc docx pdf</text>
    <text x="992" y="324" fill="#79c0ff" font-size="14" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">xls xlsx rtf</text>
    <text x="992" y="356">since 2024-01-01</text>
    <text x="992" y="380">every 300 s</text>

    <!-- 5 -->
    <rect x="1276" y="206" width="264" height="196" rx="8" fill="#2d1214" stroke="#f85149"/>
    <text x="1296" y="242" fill="#e6edf3" font-size="18" font-weight="700">Exfiltration</text>
    <text x="1296" y="272">HTTP PUT (WebDAV)</text>
    <text x="1296" y="304" fill="#ffa198" font-size="14" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">webdav-pred1.</text>
    <text x="1296" y="324" fill="#ffa198" font-size="14" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">alwaysdata[.]net</text>
    <text x="1296" y="356">user "pred1"</text>
  </g>

  <g stroke="#8b949e" stroke-width="2" fill="none">
    <line x1="326" y1="304" x2="360" y2="304" marker-end="url(#ar)"/>
    <line x1="630" y1="304" x2="664" y2="304" marker-end="url(#ar)"/>
    <line x1="934" y1="304" x2="968" y2="304" marker-end="url(#ar)"/>
    <line x1="1238" y1="304" x2="1272" y2="304" marker-end="url(#ar)"/>
  </g>

  <text x="60" y="446" fill="#8b949e" font-size="15">No persistence. It runs as long as that powershell.exe lives,</text>
  <text x="60" y="468" fill="#8b949e" font-size="15">and again every time the victim opens the workbook.</text>
  <text x="972" y="446" fill="#8b949e" font-size="14" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">%USERPROFILE%\Documents\OpenDriveBackupLogs\sent_files.log</text>

  <!-- section 2 -->
  <line x1="60" y1="490" x2="1540" y2="490" stroke="#30363d"/>
  <text x="60" y="536" fill="#58a6ff" font-size="18" font-weight="700">Why sandboxes saw nothing</text>

  <rect x="60" y="572" width="330" height="266" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="84" y="616" fill="#e6edf3" font-size="16" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">Sheets("<tspan fill="#d29922">?????</tspan>")</text>
  <g font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#e3b341">
    <rect x="84" y="630" width="50" height="50" rx="5" fill="#3d2e00" stroke="#d29922"/><text x="109" y="664" text-anchor="middle">CB</text>
    <rect x="140" y="630" width="50" height="50" rx="5" fill="#3d2e00" stroke="#d29922"/><text x="165" y="664" text-anchor="middle">E8</text>
    <rect x="196" y="630" width="50" height="50" rx="5" fill="#3d2e00" stroke="#d29922"/><text x="221" y="664" text-anchor="middle">F1</text>
    <rect x="252" y="630" width="50" height="50" rx="5" fill="#3d2e00" stroke="#d29922"/><text x="277" y="664" text-anchor="middle">F2</text>
    <rect x="308" y="630" width="50" height="50" rx="5" fill="#3d2e00" stroke="#d29922"/><text x="333" y="664" text-anchor="middle">31</text>
  </g>
  <text x="84" y="726" fill="#c9d1d9" font-size="15">VBA project codepage: 1251</text>
  <text x="84" y="752" fill="#8b949e" font-size="15">Decoded with the system locale</text>

  <g fill="none" stroke-width="2.5">
    <path d="M392 705 C 450 705, 450 610, 500 610" stroke="#3fb950" marker-end="url(#arG)"/>
    <path d="M392 705 L 500 705" stroke="#f85149" marker-end="url(#arR)"/>
    <path d="M392 705 C 450 705, 450 800, 500 800" stroke="#f85149" marker-end="url(#arR)"/>
  </g>

  <g>
    <rect x="504" y="572" width="1036" height="76" rx="8" fill="#0f2417" stroke="#3fb950"/>
    <text x="528" y="604" fill="#56d364" font-size="15" font-weight="700">CP1251</text>
    <text x="528" y="628" fill="#8b949e" font-size="13">uk-UA, ru-RU</text>
    <text x="720" y="622" fill="#e6edf3" font-size="30" font-weight="700" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">"Лист1"</text>
    <text x="1516" y="618" fill="#56d364" font-size="17" font-weight="700" text-anchor="end">runs</text>
  </g>
  <g>
    <rect x="504" y="667" width="1036" height="76" rx="8" fill="#2d1214" stroke="#f85149"/>
    <text x="528" y="699" fill="#ff7b72" font-size="15" font-weight="700">CP1252</text>
    <text x="528" y="723" fill="#8b949e" font-size="13">en-US (sandboxes)</text>
    <text x="720" y="717" fill="#e6edf3" font-size="30" font-weight="700" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">"Ëèñò1"</text>
    <text x="1516" y="713" fill="#ff7b72" font-size="17" font-weight="700" text-anchor="end">Error 9: Subscript out of range</text>
  </g>
  <g>
    <rect x="504" y="762" width="1036" height="76" rx="8" fill="#2d1214" stroke="#f85149"/>
    <text x="528" y="794" fill="#ff7b72" font-size="15" font-weight="700">CP1257</text>
    <text x="528" y="818" fill="#8b949e" font-size="13">lt-LT</text>
    <text x="720" y="812" fill="#e6edf3" font-size="30" font-weight="700" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">"Ėčńņ1"</text>
    <text x="1516" y="808" fill="#ff7b72" font-size="17" font-weight="700" text-anchor="end">Error 9: Subscript out of range</text>
  </g>

  <text x="1540" y="904" fill="#484f58" font-size="13" text-anchor="end">github.com/Wortexz</text>
</svg>
